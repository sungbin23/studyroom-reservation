<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="도서관 스터디룸을 휴대폰으로 빠르게 예약해요.">
  <title>스터디룸 예약</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css"
    integrity="sha384-2nNKoOPayicGa+aRguOQuiZP+RqQ4G3jalfDeOgftkKD7zBM2gJXTwcFqCZltdv0"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    media="print"
    onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
  <script async
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
    onload="window.dispatchEvent(new Event('qr-ready'))"
    onerror="window.qrFailed = true; window.dispatchEvent(new Event('qr-failed'))"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="topbar-row">
        <button id="btn-back" class="back" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg>
          <span>이전</span>
        </button>
        <p class="app-name">스터디룸 예약</p>
        <p class="step-count"><strong id="step-count">1/3</strong></p>
      </div>
      <div class="progress">
        <span class="progress-label" id="step-label">조건 고르기</span>
        <div class="progress-bar" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
    </header>

    <main id="screen">
      <noscript><p class="noscript">이 예약 화면은 JavaScript가 켜져 있어야 동작해요.</p></noscript>
    </main>

    <footer class="testbar">
      <label class="test-toggle">
        <input id="test-toggle" type="checkbox">
        <span class="switch" aria-hidden="true"></span>
        <span>테스트 모드 <span id="test-state">꺼짐</span></span>
      </label>
      <button id="test-reset" class="test-btn" type="button" hidden>측정 초기화</button>
      <button id="test-fail" class="test-btn" type="button" aria-pressed="false" hidden>승인 실패 재현</button>
    </footer>

    <div id="dock" class="dock" hidden></div>
  </div>

  <div id="modal-root" hidden></div>
  <div id="hud" class="hud" hidden></div>
</body>
</html>
